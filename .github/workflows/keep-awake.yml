name: Keep Streamlit app awake

on:
  schedule:
    # Every 3 days at 09:00 UTC. Streamlit Cloud sleeps after ~7 days idle,
    # so a 3-day cadence gives a 2x safety margin.
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          URL="https://lightplan.streamlit.app"
          echo "Pinging $URL"
          curl -fsSL --retry 3 --retry-delay 10 --max-time 60 "$URL" -o /dev/null
          echo "Ping OK"
