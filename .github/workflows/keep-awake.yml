name: Keep Streamlit app awake

on:
  schedule:
    # Fires daily at 06:00 UTC. The job then sleeps a random 0-4 hours before
    # pinging, so consecutive pings land 20-28 h apart at unpredictable times.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Random delay (0-4 h)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(( RANDOM % 14400 ))
          echo "Sleeping $DELAY seconds (~$(( DELAY / 60 )) min) before ping"
          sleep "$DELAY"

      - name: Ping app
        run: |
          URL="https://lightplan.streamlit.app"
          echo "Pinging $URL"
          # The goal is to send traffic, not validate the response. Streamlit's
          # sleep page can bounce a JS-less client (curl exit 47), so we accept
          # any outcome and just log the HTTP status.
          STATUS=$(curl -sSL -o /dev/null -w "%{http_code}" \
            --max-redirs 20 --max-time 60 \
            -A "Mozilla/5.0 keep-awake-bot" "$URL" || echo "curl-err")
          echo "HTTP status: $STATUS"
